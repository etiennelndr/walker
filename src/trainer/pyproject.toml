[build-system]
requires = ["hatchling>=1.32.0,<2.0.0", "uv-dynamic-versioning>=0.14.0,<1.0.0"]
build-backend = "hatchling.build"

[project]
name = "walker.trainer"
dynamic = [
    # The version is computed from the git tags at build/installation time
    "version"
]
description = "Training of autonomous movements of bots in unknown locations."
authors = [
    { name = "Etienne Landuré", email = "25793763+etiennelndr@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "walker.config",
    "cupy-cuda13x[ctk]",
    "keras",
    "prefect==3.8.8",
    "torch",
    "typer==0.27.3",
]

[project.scripts]
trainer = "walker.trainer.__main__:main"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/walker"]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.uv.sources]
"walker.config" = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
